<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AETHERIA Snake OS</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #020b07;
            color: #ecfdf5;
            font-family: 'Plus Jakarta Sans', sans-serif, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
            background: rgba(6, 28, 19, 0.65);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 20px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }
        h1 { font-size: 1.5rem; margin-bottom: 10px; color: #34d399; letter-spacing: 2px; }
        .score-board {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 1rem;
            font-weight: bold;
            color: #a7f3d0;
        }
        canvas {
            background: #010805;
            border: 2px solid rgba(16, 185, 129, 0.4);
            border-radius: 12px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.9);
            display: block;
            margin: 0 auto;
        }
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 70px);
            gap: 10px;
            margin-top: 20px;
            justify-content: center;
        }
        .ctrl-btn {
            background: linear-gradient(135deg, #10b981 0%, #047857 100%);
            color: white;
            border: none;
            padding: 18px;
            font-size: 1.2rem;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(16,185,129,0.3);
            transition: transform 0.1s;
        }
        .ctrl-btn:active { transform: scale(0.92); }
        .empty { visibility: hidden; }
    </style>
</head>
<body>

<div class="container">
    <h1>SNAKE OS</h1>
    <div class="score-board">
        <span>SCORE: <span id="score">0</span></span>
        <span>HIGH: <span id="highScore">0</span></span>
    </div>
    
    <canvas id="gameCanvas" width="360" height="360"></canvas>

    <div class="controls">
        <div class="empty"></div>
        <button class="ctrl-btn" onclick="changeDir('UP')">▲</button>
        <div class="empty"></div>
        <button class="ctrl-btn" onclick="changeDir('LEFT')">◀</button>
        <button class="ctrl-btn" onclick="changeDir('DOWN')">▼</button>
        <button class="ctrl-btn" onclick="changeDir('RIGHT')">▶</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const gridSize = 20;
    const tileCount = canvas.width / gridSize;

    let snake = [{ x: 10, y: 10 }];
    let food = { x: 5, y: 5 };
    let dx = 0;
    let dy = 0;
    let score = 0;
    let highScore = localStorage.getItem('snake_high') || 0;
    let gameInterval = null;
    let changingDirection = false;

    document.getElementById('highScore').textContent = highScore;

    document.addEventListener('keydown', handleKeyPress);

    function startGame() {
        resetGame();
        if (gameInterval) clearInterval(gameInterval);
        gameInterval = setInterval(main, 110);
    }

    function main() {
        if (hasGameEnded()) {
            clearInterval(gameInterval);
            alert('Game Over! Score: ' + score);
            startGame();
            return;
        }
        changingDirection = false;
        clearCanvas();
        drawFood();
        moveSnake();
        drawSnake();
    }

    function clearCanvas() {
        ctx.fillStyle = '#010805';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function drawSnake() {
        snake.forEach((part, index) => {
            ctx.fillStyle = index === 0 ? '#34d399' : '#059669';
            ctx.shadowBlur = index === 0 ? 12 : 0;
            ctx.shadowColor = '#10b981';
            ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
        });
        ctx.shadowBlur = 0;
    }

    function moveSnake() {
        const head = { x: snake[0].x + dx, y: snake[0].y + dy };
        snake.unshift(head);

        if (head.x === food.x && head.y === food.y) {
            score += 10;
            document.getElementById('score').textContent = score;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snake_high', highScore);
                document.getElementById('highScore').textContent = highScore;
            }
            generateFood();
        } else {
            snake.pop();
        }
    }

    function generateFood() {
        food.x = Math.floor(Math.random() * tileCount);
        food.y = Math.floor(Math.random() * tileCount);
        snake.forEach(part => {
            if (part.x === food.x && part.y === food.y) generateFood();
        });
    }

    function drawFood() {
        ctx.fillStyle = '#fbbf24';
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#fbbf24';
        ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);
        ctx.shadowBlur = 0;
    }

    function changeDir(direction) {
        if (changingDirection) return;
        if (direction === 'UP' && dy === 0) { dx = 0; dy = -1; changingDirection = true; }
        if (direction === 'DOWN' && dy === 0) { dx = 0; dy = 1; changingDirection = true; }
        if (direction === 'LEFT' && dx === 0) { dx = -1; dy = 0; changingDirection = true; }
        if (direction === 'RIGHT' && dx === 0) { dx = 1; dy = 0; changingDirection = true; }
    }

    function handleKeyPress(event) {
        const keyPressed = event.keyCode;
        if (keyPressed === 37 && dx === 0) { dx = -1; dy = 0; changingDirection = true; }
        if (keyPressed === 38 && dy === 0) { dx = 0; dy = -1; changingDirection = true; }
        if (keyPressed === 39 && dx === 0) { dx = 1; dy = 0; changingDirection = true; }
        if (keyPressed === 40 && dy === 0) { dx = 0; dy = 1; changingDirection = true; }
    }

    function hasGameEnded() {
        const head = snake[0];
        if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) return true;
        for (let i = 4; i < snake.length; i++) {
            if (snake[i].x === head.x && snake[i].y === head.y) return true;
        }
        return false;
    }

    function resetGame() {
        snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
        dx = 1;
        dy = 0;
        score = 0;
        document.getElementById('score').textContent = score;
        generateFood();
    }

    startGame();
</script>

</body>
</html>
